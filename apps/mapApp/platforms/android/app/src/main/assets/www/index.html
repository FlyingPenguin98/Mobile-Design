<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geo Location</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style>
      html { height: 100% }
      body { height: 100%; margin: 0; padding: 0 }
      #map-canvas { height: 100% }
      #mapInfo{height: 3em;border: 1px solid black; border-radius: 25px;}
   </style>
    <script src="cordova.js"></script>
    <script async defer
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMsJIBucizITqwEgdcD21mDpc0mC2-UcU&callback=initMap"></script>
    <script>
      navigator.geolocation.getCurrentPosition( onSuccess, onError, { timeout: 30000 } );

      function onSuccess( position ) {
         if ( position.coords ) {
            let lat = position.coords.latitude,
              lng=position.coords.longitude,

            //Google Maps
              myLatlng = new google.maps.LatLng( lat, lng ),
              mapOptions = { zoom: 15, center: myLatlng },
              map = new google.maps.Map( document.getElementById( 'map-canvas' ), mapOptions ),
              marker = new google.maps.Marker( { position: myLatlng, map: map } );
              document.getElementById('mapInfo').innerHTML = "<p>Latitude: " + lat + " Longitude: " + lng + "</p>";
            //Weather
            city = 'Rochester';
            key = 'df4d26258694730c80f2c8cd43adf44f'
            $.ajax({
               url:'httlp://api.openweathermap.org/data/2.5/weather',
               dataType:'json',
               type:'GET',
               data:{q:city,appid: key,units: 'metric'},

               success: function(data){
                  wf = '';
                  $.each(data.weather, function(index,val)){
                     wf += '<p><b>' + data.name + "</b>" + data.main.temp;
                  }
                  document.getElementById('weather').innerHTML = wf;
               }
            })
         }


      }

      function onError(error) {
         alert('code: ' + error.code + '\n' + 'message: ' + error.message + '\n');
      }

      google.maps.event.addDomListener( window, 'load', onSuccess );

   </script>
</head>
<body>
<div id ="mapInfo"></div>
<div id ="weather"></div>
<div id="map-canvas"><h3>Loading map. Please wait...</h3></div>
</body>
</html>
